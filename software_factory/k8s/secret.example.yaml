# Template only. Never commit a filled-in copy of this file.
#
# The runtime now refuses to start when any of these are missing, so an incomplete
# deployment fails as a deploy error rather than serving unconfigured traffic.
apiVersion: v1
kind: Secret
metadata:
  name: factory-secrets
  namespace: factory-production
type: Opaque
stringData:
  # Required. The service exits non-zero without it.
  GEMINI_API_KEY: "REPLACE_ME"
  # Required. The service exits non-zero without it.
  APPWRITE_API_KEY: "REPLACE_ME"
  # Required, format tenant_id:key,tenant_id:key.
  # One credential bound to two tenants is rejected at startup: a shared secret cannot
  # identify a partition.
  TENANT_API_KEYS: "tenant_re_8841:REPLACE_ME,tenant_hc_1042:REPLACE_ME"
