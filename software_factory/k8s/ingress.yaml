apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: software-factory-ingress
  namespace: factory-production
  annotations:
    kubernetes.io/ingress.class: "gce"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # The cert-manager issuer annotation above requests a certificate, but without this block
  # nothing binds it, so the host would be served over plain HTTP.
  tls:
    - hosts:
        - api.softwarefactory.enterprise
      secretName: software-factory-runtime-tls
  rules:
    - host: api.softwarefactory.enterprise
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: software-factory-runtime
                port:
                  number: 8080
