# Software Factory review and security integrations.
#
# The rule this file exists to enforce: an integration that did not run must never be
# reported as a pass. Every job below resolves its own credentials, and a job whose secret is
# absent reports `skipped` with the reason -- visible in the checks list -- rather than
# exiting zero. A green check that means "nothing was verified" is worse than a missing one,
# because a merge gate that reads green is a merge gate nobody is watching.
#
# That is not hypothetical here. This repository's CI was green through every release while
# its production Docker image could not be built at all, and while the Kubernetes egress
# policy permitted 0.0.0.0/0. Both were invisible because nothing asserted them and no
# external reviewer was in the loop. These integrations are the missing review layer, and
# they are only worth adding if they report honestly when disconnected.
#
# Each integration needs TWO things, and setting only one of them is worse than setting neither:
#
#   repository variable (non-secret)   repository secret
#   ---------------------------        ---------------------------------
#   CODERABBIT_ENABLED=true            CODERABBIT_API_KEY
#   SONAR_ENABLED=true                 SONAR_TOKEN (+ SONAR_HOST_URL)
#   SNYK_ENABLED=true                  SNYK_TOKEN
#   DATADOG_ENABLED=true               DATADOG_API_KEY
#
# The variable is what the job-level `if` reads, because the secrets context is not available
# there. This file was invalid for its entire life because it referenced `secrets` in a job-level
# `if`, so GitHub rejected it and every run failed in zero seconds with no jobs. Nothing in the
# repository noticed, because a workflow that never runs looks exactly like a workflow with
# nothing to do. The variable gates the job; the first step in the job then asserts the secret is
# really there, so an enabled-but-unset pair fails loudly instead of skipping its own work and
# reporting success. `actionlint` now runs in verify.yml, which is what keeps this from recurring.
#
# None of them is required for a fork PR to pass. See the `if:` conditions; they are written
# so a contributor without access to the secrets still gets a full, honest verification run
# from verify.yml rather than a failure they cannot fix.

name: integrations

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── CodeRabbit ──────────────────────────────────────────────────────────────────────────
  # CodeRabbit is the only one of these that needs an API key to be useful rather than to
  # run: its GitHub App is what posts review comments, and the action without a key
  # configures nothing and says so. Skipped is the honest outcome for a fork PR.
  coderabbit:
    name: CodeRabbit review
    if: ${{ github.event_name == 'pull_request' && vars.CODERABBIT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assert CODERABBIT_API_KEY is actually present
        # The job gate reads a repository variable because the secrets context is not available
        # in a job-level `if` -- referencing it there makes GitHub reject the entire workflow, so
        # the file silently never ran. That is the bug this step exists to close: the variable can
        # be set while the secret is not, and without this check the job would skip its own work
        # and report success for having verified nothing.
        env:
          SECRET_VALUE: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::CODERABBIT_ENABLED is enabled but CODERABBIT_API_KEY is not set. Enable the variable and the secret together, or the job reports a pass that means nothing."
            exit 1
          fi
          echo "CODERABBIT_API_KEY is present"
      - uses: actions/checkout@v4
        with:
          # The MCP knowledge server is the point of the integration: CodeRabbit reviews with
          # the constitution and ADRs in hand rather than from the diff alone. It runs as a
          # process over stdio, so nothing is exposed on a port and no credential is involved.
          path: .
      - name: Verify the knowledge base MCP server is serving this repository
        run: node scripts/kb-mcp-server.mjs --self-test
      - name: Run CodeRabbit
        uses: coderabbitai/action@v3
        with:
          api_key: ${{ secrets.CODERABBIT_API_KEY }}
          # Review only what changed. The full-history configuration is what produced
          # unreviewed releases: a reviewer that reads the whole tree never finishes, and a
          # reviewer that reads nothing is not a review.
          tools: base
          path_instructions: |
            docs/CONSTITUTION.md: binding. Any change touching money, tenants, credentials or
              submission paths must cite the article it complies with. Call a change a
              non-conformance if the code does not satisfy a claim the constitution makes.
            docs/adr/: binding decisions. A change that contradicts an accepted ADR needs a
              new ADR, not a refactor. Say which ADR is contradicted.
            scripts/verify-*.sh, scripts/*.mjs: gates. A new gate is only evidence if it was
              shown to fail without its fix. A test that cannot fail is not a test.
            docs/CONSTITUTION.md -> "Known non-conformances": if a resolved entry describes
              behaviour the diff changes, the entry is now false. Flag it.
            software_factory/k8s/: egress must never return to 0.0.0.0/0, and rendered CIDRs
              are snapshots, not durable controls. Both facts are load-bearing.

  # ── SonarQube ───────────────────────────────────────────────────────────────────────────
  # Runs on push and on same-repo PRs only. Without a token this reports skipped, not passed.
  sonarqube:
    name: SonarQube analysis
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assert SONAR_TOKEN is actually present
        # The job gate reads a repository variable because the secrets context is not available
        # in a job-level `if` -- referencing it there makes GitHub reject the entire workflow, so
        # the file silently never ran. That is the bug this step exists to close: the variable can
        # be set while the secret is not, and without this check the job would skip its own work
        # and report success for having verified nothing.
        env:
          SECRET_VALUE: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::SONAR_ENABLED is enabled but SONAR_TOKEN is not set. Enable the variable and the secret together, or the job reports a pass that means nothing."
            exit 1
          fi
          echo "SONAR_TOKEN is present"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube needs history to attribute new-code blame correctly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: SonarQube scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Quality gate failure must fail the build. A quality gate that only annotates is
          # a dashboard, and this repository already learned what an unasserted signal costs.
          args: >
            -Dsonar.projectBaseBranch=main
            -Dsonar.qualitygate.wait=true
            -Dsonar.sources=src,server.ts,scripts
            -Dsonar.exclusions=dist/**,node_modules/**,test/**,**/*.d.ts
            -Dsonar.typescript.tsconfigPath=tsconfig.json
            -Dsonar.rust.exclusions=software_factory/target/**
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}

  # ── Snyk ────────────────────────────────────────────────────────────────────────────────
  # Dependency vulnerabilities. Scoped to the two ecosystems that actually ship, because a
  # scan that reports every devDependency turns a security signal into noise people mute.
  snyk:
    name: Snyk dependency scan
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assert SNYK_TOKEN is actually present
        # The job gate reads a repository variable because the secrets context is not available
        # in a job-level `if` -- referencing it there makes GitHub reject the entire workflow, so
        # the file silently never ran. That is the bug this step exists to close: the variable can
        # be set while the secret is not, and without this check the job would skip its own work
        # and report success for having verified nothing.
        env:
          SECRET_VALUE: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::SNYK_ENABLED is enabled but SNYK_TOKEN is not set. Enable the variable and the secret together, or the job reports a pass that means nothing."
            exit 1
          fi
          echo "SNYK_TOKEN is present"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: snyk/actions/node@1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
      - name: Fail on high or critical vulnerabilities
        # The gate runs separately from the scan so that the failure is attributable to a
        # named step in the checks list, rather than being folded into a scanner's exit code.
        run: npx snyk test --severity-threshold=high --fail-on=high || exit 1

  # ── Datadog ─────────────────────────────────────────────────────────────────────────────
  # The Rust runtime already exposes Prometheus metrics at /metrics, verified by
  # scripts/verify-image.sh. This publishes the build's own verification result so the
  # release appears in the operational timeline. It does not scrape production: nothing here
  # has cluster access, and claiming live metrics from a CI runner would be the exact kind of
  # invented measurement this repository's constitution forbids.
  datadog-metrics:
    name: Datadog release metrics
    if: ${{ vars.DATADOG_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert DATADOG_API_KEY is actually present
        # The job gate reads a repository variable because the secrets context is not available
        # in a job-level `if` -- referencing it there makes GitHub reject the entire workflow, so
        # the file silently never ran. That is the bug this step exists to close: the variable can
        # be set while the secret is not, and without this check the job would skip its own work
        # and report success for having verified nothing.
        env:
          SECRET_VALUE: ${{ secrets.DATADOG_API_KEY }}
        run: |
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::DATADOG_ENABLED is enabled but DATADOG_API_KEY is not set. Enable the variable and the secret together, or the job reports a pass that means nothing."
            exit 1
          fi
          echo "DATADOG_API_KEY is present"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Run every local gate and publish the result
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE }}
        run: |
          set -uo pipefail
          # Report what actually ran, including the gates that could not. A metric that only
          # records passes cannot show a regression, and a metric that records a pass for a
          # gate which never executed is a false record.
          results=()
          while IFS='|' read -r name status detail; do
            results+=("$name:$status")
            echo "$name: $status ${detail:0:80}"
          done < <(node scripts/generate-dashboard.mjs --json \
            | node -e '
              let raw = "";
              process.stdin.on("data", (c) => (raw += c));
              process.stdin.on("end", () => {
                const record = JSON.parse(raw);
                for (const gate of record.verification) {
                  console.log([gate.name.replace(/\|/g, "/"), gate.ok ? "pass" : "FAIL", gate.detail.replace(/\|/g, "/")].join("|"));
                }
                console.log(["nonConformancesOpen", record.governance.openNonConformances.length, "count"].join("|"));
                console.log(["unmeasuredItems", record.notMeasuredHere.length, "count"].join("|"));
              });
            ')
          payload=$(printf '%s\n' "${results[@]}" | tr '\n' ',' | sed 's/,$//')
          if [ -z "${DD_SITE:-}" ]; then
            echo "DD_SITE is not set; skipping the API call and reporting locally only."
            echo "Recorded: $payload"
            exit 0
          fi
          curl -fsS -X POST "https://api.${DD_SITE}.datadoghq.com/api/v1/series" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"series\":[{\"metric\":\"software_factory.release_verification\",\"type\":\"count\",\"points\":[[$(date +%s),1]],\"tags\":[\"commit:${GITHUB_SHA::7}\",\"results:${payload}\"]}]}" \
            || { echo "Datadog publish failed; not treating it as a verification pass."; exit 1; }
